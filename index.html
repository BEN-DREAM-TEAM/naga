<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAGA Transport</title>
<meta name="apple-mobile-web-app-title" content="NAGA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="naga-bande-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="naga-bande-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;min-height:100%;background:#F1F6FC;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;color:#14223B}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
  img{width:120px;height:120px;border-radius:27px;box-shadow:0 4px 14px rgba(20,34,59,.15)}
  h1{margin:0;font-size:26px}
  p{margin:0;color:#56677F;max-width:320px;line-height:1.45}
  .aide{background:#fff;border:1px solid #D4E0EE;border-radius:14px;padding:14px 16px;text-align:left}
  a.btn{display:inline-block;background:#1C7FE0;color:#fff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:14px}
</style>
</head>
<body>
<main>
  <img src="naga-bande-192.png" alt="">
  <h1>NAGA Transport</h1>
  <div class="aide" id="aide">
    <p><b>Installer l'icône :</b><br>
    iPhone : touchez <b>Partager</b> puis <b>Sur l'écran d'accueil</b>.<br>
    Android : touchez <b>⋮</b> puis <b>Ajouter à l'écran d'accueil</b>.</p>
  </div>
  <a class="btn" href="https://script.google.com/macros/s/AKfycbxRZBBQ-Plv5uf2NpjFLjhbpM7M5qWv65rCnt8ZVjevNJDMStfutaBerigj8D8Zrc8/exec">Ouvrir NAGA Transport</a>
</main>
<script>
  // Ouvert depuis l'icône de l'écran d'accueil : on va directement à l'application.
  var depuisIcone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (depuisIcone) {
    document.getElementById("aide").hidden = true;
    location.replace("https://script.google.com/macros/s/AKfycbxRZBBQ-Plv5uf2NpjFLjhbpM7M5qWv65rCnt8ZVjevNJDMStfutaBerigj8D8Zrc8/exec");
  }
</script>
</body>
</html>
